# Local static configuration. Applications use plain HTTP hostnames such as
# baby.localhost, so local development needs neither public DNS nor certificates.

entryPoints:
  web:
    address: ':80'

  websecure:
    address: ':443'

  traefik:
    address: ':8080'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    network: traefik-public

api:
  dashboard: true
  insecure: true

ping:
  entryPoint: traefik

log:
  level: INFO

accessLog: {}
